name: Scrape farmacias
on:
  schedule:
    # El turno corre de 08:30 a 08:30 del día siguiente (hora de Argentina,
    # UTC-3 todo el año), así que solo hay datos nuevos una vez por día.
    # Tres corridas alcanzan y sobran:
    #   11:40 UTC = 08:40 ART · arranca el turno nuevo
    #   16:40 UTC = 13:40 ART · por si el sitio publicó tarde o corrigió
    #   23:40 UTC = 20:40 ART · última pasada antes de la noche
    # Los :40 son a propósito: el scheduler de Actions se demora más cuanto
    # más cerca de la hora en punto se lo agenda.
    - cron: '40 11,16,23 * * *'
  workflow_dispatch:      # también manual desde la UI
  # Este workflow es el único que publica Pages, así que un cambio al sitio
  # no se ve hasta que corra. Sin esto habría que esperar al próximo cron.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/scrape.yml'

# Un solo deploy a Pages a la vez. Sin cancel-in-progress: si llegan dos
# corridas juntas queremos que la segunda espere, no que pise a la primera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: mkdir -p docs/data
      - run: python app.py --dump docs/data/farmacias.json

      # La key de CARTO no se versiona: config.js se arma acá desde el secret
      # y viaja al deploy igual que el JSON. Sin el secret se publica igual,
      # con la key vacía (tiles con marca de agua) y un warning en la corrida.
      - name: Generar docs/config.js
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          [ -n "$CARTO_API_KEY" ] || echo "::warning::Falta el secret CARTO_API_KEY; el mapa sale con marca de agua"
          python -c 'import json, os; print("window.FARMAGUARDIA_CONFIG = " + json.dumps({"cartoKey": os.environ["CARTO_API_KEY"]}) + ";")' > docs/config.js

      # Publicamos desde el workflow: el build implícito de Pages no se ve ni
      # se puede reintentar, y si se cuelga el sitio queda viejo en silencio.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write     # deploy-pages se autentica con OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
