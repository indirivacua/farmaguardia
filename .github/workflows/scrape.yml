name: Scrape farmacias
on:
  schedule:
    # El turno corre de 08:30 a 08:30 del día siguiente (hora de Argentina,
    # UTC-3 todo el año), así que solo hay datos nuevos una vez por día.
    # Tres corridas alcanzan y sobran:
    #   11:40 UTC = 08:40 ART · arranca el turno nuevo
    #   16:40 UTC = 13:40 ART · por si el sitio publicó tarde o corrigió
    #   23:40 UTC = 20:40 ART · última pasada antes de la noche
    # Los :40 son a propósito: el scheduler de Actions se demora más cuanto
    # más cerca de la hora en punto se lo agenda.
    - cron: '40 11,16,23 * * *'
  workflow_dispatch:      # también manual desde la UI

# Un solo deploy a Pages a la vez. Sin cancel-in-progress: si llegan dos
# corridas juntas queremos que la segunda espere, no que pise a la primera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: mkdir -p docs/data
      - run: python app.py --dump docs/data/farmacias.json
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: actualización automática'
          file_pattern: 'docs/data/farmacias.json'
          # Sin esto la action firma como autor al dueño del repo
          # (github.actor). Estos commits los hace el bot, no una persona.
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'

      # El artefacto sale del workspace, no del repo. Es a propósito: si el
      # JSON scrapeado es idéntico al que ya está commiteado, la action de
      # arriba no commitea y antes tampoco se publicaba nada (el build viejo
      # colgaba del push). Así el sitio se republica en cada corrida.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write     # deploy-pages se autentica con OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
